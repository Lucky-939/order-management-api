# Database connection URL for local MySQL instance and target database
spring.datasource.url=jdbc:mysql://localhost:3306/order_db

# Credentials injected via environment variables so no sensitive secrets are committed to version control
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate DDL auto update creates/updates tables on startup without dropping existing data
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL statements in the console for observability
spring.jpa.show-sql=true

# Format SQL output for better readability in logs
spring.jpa.properties.hibernate.format_sql=true

# Disables Open-in-View to avoid keeping database connections open across the entire web request lifecycle
spring.jpa.open-in-view=false
